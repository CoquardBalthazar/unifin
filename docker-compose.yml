services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: unifin
      POSTGRES_USER: unifin
      POSTGRES_PASSWORD: unifin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unifin"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ./backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://unifin:unifin@postgres:5432/unifin
    env_file:
      - ./backend/.env
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

